name: rooster_trader
description: Rooster Trader - Poultry Trading Operating System
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^18.1.4
  supabase_flutter: ^2.18.3
  intl: ^0.20.2
  image_picker: ^1.1.2
  flutter_blue_plus: ^1.32.12        # Keep for future BLE features

  flutter_bluetooth_serial:
    path: local_packages/flutter_bluetooth_serial   # Bluetooth Classic for weighing scale (SPP)

  sqflite: ^2.3.0                    # Local SQLite - offline crash-safe storage
  path: ^1.9.0                       # Path utils for sqflite
  path_provider: ^2.1.2              # App/downloads directory
  share_plus: ^13.3.1                # Native share sheet (WhatsApp, Gmail etc.)
  printing: ^5.13.2                  # PDF print dialog
  pdf: ^3.10.8                       # PDF document builder
  permission_handler: ^13.0.2       # Runtime permissions (BT, storage)
  audioplayers: ^6.8.1
  shared_preferences: ^2.5.5

  http: any
  archive: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/sounds/beep.mp3