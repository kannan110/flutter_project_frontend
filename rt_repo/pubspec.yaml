name: rooster_trader
description: Rooster Trader v2 — Complete Poultry Trading Platform
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.5

  # Charts
  fl_chart: ^0.67.0

  # PDF + printing
  pdf: ^3.10.8
  printing: ^5.12.0

  # Sharing + URLs
  share_plus: ^9.0.0
  url_launcher: ^6.3.0

  # Image
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # Location + Maps
  geolocator: ^11.0.0
  google_maps_flutter: ^2.7.0

  # Utilities
  intl: ^0.19.0
  path_provider: ^2.1.3
  package_info_plus: ^8.0.0
  equatable: ^2.0.5
  uuid: ^4.4.0

  # UI
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
